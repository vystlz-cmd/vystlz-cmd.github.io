<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Radon Live Chat</title>
    <!-- Live, automatic database streaming library (Bypasses school blocks) -->
    <script src="https://cloudflare.com"></script>
    <style>
        body { font-family: "Segoe UI", sans-serif; background-color: #1e1e1e; color: #e0e0e0; margin: 0; padding: 0; height: 100vh; display: flex; }
        #sidebar { width: 220px; background-color: #252526; display: flex; flex-direction: column; border-right: 1px solid #2d2d2d; }
        #profile-tag { color: #4fc3f7; font-weight: bold; padding: 15px; border-bottom: 1px solid #2d2d2d; font-size: 16px; }
        #peer-list { flex-grow: 1; overflow-y: auto; padding: 10px; }
        .peer-item { padding: 8px 12px; margin-bottom: 4px; border-radius: 4px; font-size: 14px; }
        .peer-item.active { background-color: #37373d; font-weight: bold; color: #4fc3f7; }
        #login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #1e1e1e; display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .modal { background: #252526; padding: 30px; border-radius: 8px; border: 1px solid #37373d; width: 300px; text-align: center; }
        #main-chat { flex-grow: 1; display: flex; flex-direction: column; background-color: #1e1e1e; }
        #chat-header { font-size: 18px; font-weight: bold; padding: 15px; border-bottom: 1px solid #2d2d2d; color: #e0e0e0; }
        #chat-log { flex-grow: 1; overflow-y: auto; padding: 20px; box-sizing: border-box; font-size: 14px; line-height: 1.5; }
        .msg-line { margin-bottom: 8px; word-wrap: break-word; }
        .msg-me { color: #4fc3f7; font-weight: bold; }
        .msg-peer { color: #9a9a9a; font-weight: bold; }
        #input-container { padding: 15px; display: flex; background: #1e1e1e; border-top: 1px solid #2d2d2d; }
        input[type="text"] { background-color: #2d2d2d; color: #e0e0e0; border: 1px solid #3c3c3c; border-radius: 4px; padding: 10px; font-size: 14px; box-sizing: border-box; outline: none; }
        input[type="text"]:focus { border-color: #4fc3f7; }
        #msg-entry { flex-grow: 1; margin-right: 10px; }
        button { background-color: #4fc3f7; color: #0d0d0d; border: none; border-radius: 4px; padding: 10px 20px; font-weight: bold; cursor: pointer; font-size: 14px; }
        button:hover { background-color: #81d4fa; }
    </style>
</head>
<body>

    <div id="login-overlay">
        <div class="modal">
            <h2 style="color: #4fc3f7; margin-top: 0;">Radon Client</h2>
            <p style="color: #9a9a9a; font-size: 12px; margin-bottom: 20px;">Ready to connect</p>
            <input type="text" id="user-entry" placeholder="Pick a username" style="width: 100%; margin-bottom: 15px;"><br>
            <button id="login-btn" onclick="initializeChat()">Enter Room</button>
        </div>
    </div>

    <div id="sidebar">
        <div id="profile-tag">Offline</div>
        <div id="peer-list">
            <div class="peer-item active">#public (Live Stream)</div>
        </div>
    </div>

    <div id="main-chat">
        <div id="chat-header">Live Serverless Room</div>
        <div id="chat-log"></div>
        <div id="input-container">
            <input type="text" id="msg-entry" placeholder="Type a message..." onkeydown="if(event.key === 'Enter') dispatchMessage()">
            <button id="send-btn" onclick="dispatchMessage()">Send</button>
        </div>
    </div>

    <script>
        // PASTE YOUR PUBLIC DETAILS FROM YOUR FREE SUPABASE ACC HERE:
        const SUPABASE_URL = "PASTE_YOUR_SUPABASE_URL_HERE";
        const SUPABASE_ANON_KEY = "PASTE_YOUR_ANON_KEY_HERE";

        let supabaseClient = null;
        let currentUsername = "Anonymous";

        function initializeChat() {
            const rawUser = document.getElementById("user-entry").value.trim();
            if (!rawUser) {
                alert("Username field cannot be left blank.");
                return;
            }
            if (SUPABASE_URL.includes("PASTE_")) {
                alert("You need to paste your Supabase keys into lines 53-54 first!");
                return;
            }
            
            currentUsername = rawUser;
            document.getElementById("profile-tag").innerText = "User: " + currentUsername;
            document.getElementById("login-overlay").style.display = "none";
            document.getElementById("msg-entry").focus();

            // Set up our database client connection profile
            supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

            // 1. Pull old messages so the screen isn't blank
            loadOldMessages();

            // 2. Open an automatic live data stream channel
            supabaseClient
                .channel('room-1')
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
                    renderSingleMessage(payload.new);
                })
                .subscribe();
        }

        function loadOldMessages() {
            supabaseClient
                .from('messages')
                .select('*')
                .order('id', { ascending: true })
                .then(res => {
                    if (res.data) {
                        res.data.forEach(msg => renderSingleMessage(msg));
                    }
                });
        }

        function renderSingleMessage(data) {
            const logBox = document.getElementById("chat-log");
            const line = document.createElement("div");
            line.className = "msg-line";
            
            if (data.sender === currentUsername) {
                line.innerHTML = "<span class='msg-me'>You:</span> " + escapeHTML(data.body);
            } else {
                line.innerHTML = "<span class='msg-peer'>" + escapeHTML(data.sender) + ":</span> " + escapeHTML(data.body);
            }
            
            logBox.appendChild(line);
            logBox.scrollTop = logBox.scrollHeight;
        }

        function dispatchMessage() {
            const msgField = document.getElementById("msg-entry");
            const content = msgField.value.trim();
            
            if (content !== "" && supabaseClient !== null) {
                // Post directly into the database grid row
                supabaseClient
                    .from('messages')
                    .insert([{ sender: currentUsername, body: content }])
                    .then(() => { msgField.value = ""; });
            }
        }

        function escapeHTML(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>

</body>
</html>
